[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ugvnet"
version = "0.2.0"
description = "Unified Global Vision Network with EfficientNetV2-S and ConvNeXt-Tiny"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "tensorboard>=2.16",
    "tensorboard-plugin-profile>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]
notebooks = ["matplotlib>=3.8", "numpy>=1.26", "pandas>=2.1", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugvnet*"]
